services:
  frontend_agua:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_API_BASE_URL_NATIVE: ${VITE_API_BASE_URL_NATIVE:-https://api-catv.tresvalles.hn}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
    container_name: frontend_agua
    ports:
      - "8080:80"
    depends_on:
      - api-catv
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-catv:
    build:
      context: ${API_CATV_ROOT:-../API_CATV}
      dockerfile: Dockerfile
    image: api-catv
    container_name: api-catv
    ports:
      - "5020:8000"
    env_file:
      - ${API_CATV_ENV_FILE:-../API_CATV/backend/.env}
    environment:
      CONTROL_AGUAS_PREFIX: /api/control-aguas
    volumes:
      - type: bind
        source: ${API_CATV_ROOT:-../API_CATV}
        target: /home/API_CATV
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
    name: proxy_net
